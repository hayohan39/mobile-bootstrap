name: New project

# [템플릿 전용] 이 템플릿에서 새 앱 프로젝트를 만든다.
#
#   1. 템플릿으로 GitHub 리포지토리 생성 + 공통 시크릿·변수 복사(Claude / Expo / Supabase / Sentry)
#   2. Supabase 프로젝트 생성(scripts/provision.mjs) → 리포지토리 시크릿·변수
#   3. 플레이스홀더·앱 식별자(bundle id) 채우기 + 템플릿 전용 파일 제거(scripts/init-project.mjs)
#   4. EAS 프로젝트 연결(eas init) + OTA 주소 + 앱 공개 환경변수(EXPO_PUBLIC_SUPABASE_*) → push
#      → 새 리포지토리의 deploy.yml 이 첫 스테이징 빌드(Android APK)를 시작한다
#   5. main 보호 규칙(PR 필수, 필수 체크 test) + 라벨
#
# Claude 클라우드 세션은 GitHub 프록시 때문에 리포지토리를 직접 만들 수 없다. 이 리포지토리에 attach 된
# 세션에서 dispatch 한다:
#
#   node scripts/gh.mjs dispatch new-project.yml name=word-cards description="..." display_name="단어 카드" bundle_id=com.me.wordcards
#
# 같은 이름으로 다시 실행해도 안전하다. 이미 있는 것은 재사용하고 빠진 것만 채운다.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "프로젝트 이름 (소문자/숫자/하이픈 — 리포지토리·Supabase·EAS slug 로 쓰임)"
        required: true
        type: string
      description:
        description: "한 줄 설명"
        type: string
        default: ""
      display_name:
        description: "폰에 보이는 앱 이름 (비우면 프로젝트 이름)"
        type: string
        default: ""
      bundle_id:
        description: "앱 식별자 (예: com.myname.wordcards — 출시 후 못 바꿈. 비우면 com.<owner>.<name>)"
        type: string
        default: ""
      visibility:
        description: "리포지토리 공개 범위"
        type: choice
        options: [private, public]
        default: private

concurrency:
  group: new-project-${{ inputs.name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"

jobs:
  create:
    if: github.event.repository.is_template
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.BOOTSTRAP_PAT }}
      NAME: ${{ inputs.name }}
      DESCRIPTION: ${{ inputs.description }}
      DISPLAY_NAME: ${{ inputs.display_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate inputs and token
        env:
          BUNDLE_ID_INPUT: ${{ inputs.bundle_id }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::BOOTSTRAP_PAT 시크릿이 없습니다. docs/bootstrap/SETUP.md 를 보세요."
            exit 1
          fi
          if ! [[ "$NAME" =~ ^[a-z0-9][a-z0-9-]{0,98}[a-z0-9]$ ]]; then
            echo "::error::이름은 소문자/숫자/하이픈만, 하이픈으로 시작·끝나지 않게: '$NAME'"
            exit 1
          fi
          owner=$(gh api user --jq .login)
          bundle=$(OWNER="$owner" BUNDLE="$BUNDLE_ID_INPUT" node --input-type=module -e '
            import { BUNDLE_ID_RE, defaultBundleId } from "./scripts/init-project.mjs";
            const id = process.env.BUNDLE || defaultBundleId(process.env.OWNER, process.env.NAME);
            if (!BUNDLE_ID_RE.test(id)) { console.error(`bundle id 형식이 아닙니다: ${id}`); process.exit(1); }
            process.stdout.write(id);')
          {
            echo "OWNER=$owner"
            echo "TARGET=$owner/$NAME"
            echo "BUNDLE_ID=$bundle"
            echo "SCHEME=${NAME//-/}"
          } >> "$GITHUB_ENV"

      - name: Create repository from this template
        env:
          VISIBILITY: ${{ inputs.visibility }}
        run: |
          if gh api "repos/$TARGET" >/dev/null 2>&1; then
            echo "이미 있는 리포지토리입니다. 재사용합니다: $TARGET"
          else
            private=true; [ "$VISIBILITY" = "public" ] && private=false
            gh api -X POST "repos/$GITHUB_REPOSITORY/generate" \
              -f owner="$OWNER" -f name="$NAME" -f description="$DESCRIPTION" \
              -F private="$private" -F include_all_branches=false >/dev/null
            echo "생성 요청: $TARGET"
          fi
          # 템플릿 복사는 비동기다. main 이 생길 때까지 기다린다.
          for _ in $(seq 1 30); do
            gh api "repos/$TARGET/branches/main" >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::60초 안에 $TARGET 의 main 브랜치가 생기지 않았습니다."
          exit 1

      # merge 된 PR 의 브랜치를 자동으로 지운다. 템플릿으로 만든 리포지토리는 이 설정을 물려받지 않는다.
      - name: Repository settings
        run: gh api -X PATCH "repos/$TARGET" -F delete_branch_on_merge=true --jq '"delete_branch_on_merge=\(.delete_branch_on_merge)"'

      # 새 리포지토리는 자기 시크릿이 있어야 워크플로가 돈다.
      - name: Copy shared secrets and variables
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOT_PAT: ${{ secrets.BOT_PAT }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          CLAUDE_REVIEW_MODEL_HIGH: ${{ vars.CLAUDE_REVIEW_MODEL_HIGH }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          EAS_CLI_VERSION: ${{ vars.EAS_CLI_VERSION }}
        run: |
          copied=(); skipped=()
          for key in CLAUDE_CODE_OAUTH_TOKEN ANTHROPIC_API_KEY BOT_PAT EXPO_TOKEN SUPABASE_ACCESS_TOKEN SENTRY_AUTH_TOKEN; do
            if [ -n "${!key}" ]; then
              printf '%s' "${!key}" | gh secret set "$key" -R "$TARGET"
              copied+=("$key")
            else
              skipped+=("$key")
            fi
          done
          echo "COPIED=${copied[*]:-없음}" >> "$GITHUB_ENV"
          echo "SKIPPED=${skipped[*]:-없음}" >> "$GITHUB_ENV"
          for key in CLAUDE_MODEL CLAUDE_REVIEW_MODEL CLAUDE_REVIEW_MODEL_HIGH SENTRY_ORG EAS_CLI_VERSION; do
            if [ -n "${!key}" ]; then gh variable set "$key" -R "$TARGET" --body "${!key}"; fi
          done

      # 리포지토리는 이미 만들어졌다. 프로비저닝이 실패해도 초기화는 계속하고 요약에서 알린다.
      # deploy.yml / preview 는 값이 없으면 실패 대신 건너뛴다.
      - name: Provision Supabase
        id: supabase
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORG_ID: ${{ vars.SUPABASE_ORG_ID || secrets.SUPABASE_ORG_ID }}
          REGION: ${{ vars.SUPABASE_REGION || 'ap-northeast-2' }}
        run: node scripts/provision.mjs --repo "$TARGET" --scheme "$SCHEME" --region "$REGION"

      # 마지막에 push 하고, 새 리포지토리의 deploy.yml 을 실행해 첫 스테이징 빌드를 시작한다(merge·push 로는 돌지 않는다).
      - name: Initialize the project, link EAS and push
        id: init
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ACCOUNT: ${{ vars.EXPO_ACCOUNT }}
          EAS_CLI_VERSION: ${{ vars.EAS_CLI_VERSION || 'latest' }}
          SUPABASE_URL: ${{ steps.supabase.outputs.supabase_url }}
          SUPABASE_KEY: ${{ steps.supabase.outputs.publishable_key }}
        run: |
          git config --global user.name "$ACTOR"
          git config --global user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          work="$RUNNER_TEMP/$NAME"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/$TARGET.git" "$work"
          cd "$work"
          if [ -f scripts/init-project.mjs ]; then
            node scripts/init-project.mjs --name "$NAME" --description "$DESCRIPTION" --display-name "$DISPLAY_NAME" --bundle-id "$BUNDLE_ID"
            echo "INIT=done" >> "$GITHUB_ENV"
          else
            echo "이미 초기화된 리포지토리입니다."
            echo "INIT=skipped" >> "$GITHUB_ENV"
          fi

          # EAS 프로젝트 연결. app.json 의 config plugin 을 읽으려면 의존성이 있어야 한다.
          eas_status=skipped
          if [ -n "$EXPO_TOKEN" ]; then
            npm ci --no-audit --no-fund
            npm install --global "eas-cli@$EAS_CLI_VERSION" >/dev/null
            account_args=()
            [ -n "$EXPO_ACCOUNT" ] && account_args=(--account "$EXPO_ACCOUNT")
            if eas init --non-interactive --force "${account_args[@]}"; then
              # OTA 업데이트 주소 = 프로젝트 id (eas update:configure 와 같은 값)
              node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("app.json","utf8"));const id=a.expo.extra?.eas?.projectId;if(!id)process.exit(1);a.expo.updates={...a.expo.updates,url:`https://u.expo.dev/${id}`};fs.writeFileSync("app.json",JSON.stringify(a,null,2)+"\n")'
              if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
                for pair in "EXPO_PUBLIC_SUPABASE_URL=$SUPABASE_URL" "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_KEY"; do
                  eas env:create --name "${pair%%=*}" --value "${pair#*=}" \
                    --environment production --environment preview --environment development \
                    --visibility plaintext --force --non-interactive
                done
              fi
              eas_status=success
            else
              eas_status=failure
            fi
          fi
          echo "EAS=$eas_status" >> "$GITHUB_ENV"

          git add -A
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다. 스테이징 배포를 다시 실행합니다."
          else
            if [ "$INIT" = done ]; then git commit -m "chore: mobile-bootstrap 에서 $NAME 초기화"; else git commit -m "chore: EAS 프로젝트 연결"; fi
            git push origin main
            sleep 5 # 새 커밋의 워크플로가 등록될 시간
          fi
          gh workflow run deploy.yml -R "$TARGET" || echo "::warning::첫 스테이징을 시작하지 못했습니다 — 새 리포지토리에서 Actions → Deploy (staging) → Run workflow"

      # 초기화 push 뒤에 건다(먼저 걸면 초기화 커밋을 main 에 직접 push 할 수 없다).
      # 비공개 리포는 GitHub Pro/Team 이상이어야 한다. 실패해도 프로젝트는 쓸 수 있고 요약에서 알린다.
      - name: Protect main
        id: protect
        continue-on-error: true
        run: node scripts/provision.mjs --repo "$TARGET" --protect

      - name: Summary
        if: always()
        env:
          SUPABASE: ${{ steps.supabase.outcome }}
          DB_URL_SET: ${{ steps.supabase.outputs.db_url_set }}
          PROTECT: ${{ steps.protect.outcome }}
        run: |
          {
            echo "## \`$TARGET\` — ${DISPLAY_NAME:-$NAME}"
            echo ""
            echo "https://github.com/$TARGET · 앱 식별자 \`$BUNDLE_ID\`"
            echo ""
            echo "| 항목 | 결과 |"
            echo "| --- | --- |"
            echo "| 복사된 시크릿 | ${COPIED:-없음} |"
            echo "| 빠진 시크릿 | ${SKIPPED:-없음} |"
            echo "| Supabase 프로젝트 | ${SUPABASE:-미실행} (DB URL 시크릿: ${DB_URL_SET:-false}) |"
            echo "| 초기화 커밋 | ${INIT:-미실행} |"
            echo "| EAS 프로젝트 연결 | ${EAS:-미실행} |"
            echo "| main 보호 (test 필수) | ${PROTECT:-미실행} |"
            echo ""
            if [ "$SUPABASE" != "success" ]; then
              echo "⚠️ Supabase 프로비저닝이 끝나지 않았습니다. 로그를 확인하고 원인을 고친 뒤 **같은 이름으로 다시 실행**하세요."
              echo ""
            elif [ "$DB_URL_SET" != "true" ]; then
              echo "⚠️ 이미 있던 Supabase 프로젝트를 재사용해서 DB 비밀번호를 모릅니다. Supabase → Connect → **Session pooler** 연결 문자열을"
              echo "새 리포지토리의 시크릿 \`SUPABASE_DB_URL\` 에 넣어 주세요(마이그레이션 배포에 필요)."
              echo ""
            fi
            if [ "$EAS" != "success" ]; then
              echo "⚠️ EAS 프로젝트를 연결하지 못했습니다(EXPO_TOKEN·EXPO_ACCOUNT 확인). 고친 뒤 같은 이름으로 다시 실행하면 연결만 합니다."
              echo ""
            fi
            if [ "$PROTECT" != "success" ]; then
              echo "⚠️ main 보호 규칙을 걸지 못했습니다. 비공개 리포는 GitHub Pro/Team 이 필요합니다(SETUP.md 의 수동 설정)."
              echo ""
            fi
            echo "### 다음 단계"
            echo ""
            echo "1. 새 리포지토리 Actions → **Deploy (staging)** 가 첫 Android 스테이징 빌드를 시작합니다(EAS 무료 큐는 수십 분 걸릴 수 있음)."
            echo "   끝나면 merge 코멘트/EAS 링크에서 APK 를 폰에 설치합니다."
            echo "2. claude.ai/code 에서 새 세션을 열고 \`$TARGET\` 선택 → 만들고 싶은 것을 설명 → Claude 가 PR 을 올립니다."
            echo "3. 남은 설정(Sentry, 스토어 계정): 새 리포지토리의 \`docs/runbook.md\` '처음 한 번', \`docs/STORE-LAUNCH.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
