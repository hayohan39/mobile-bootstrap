name: Preview cleanup

# PR 이 닫히면 그 PR 의 EAS Update 브랜치(pr-<n>)를 지운다. (웹 프리뷰 별칭은 남겨 두어도 비용이 없다.)
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.repository.is_template
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      # PR 브랜치는 이미 지워졌을 수 있으므로 base(main) 를 체크아웃한다.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      # eas 가 app.json 의 config plugin 을 읽으려면 의존성이 있어야 한다.
      - uses: actions/setup-node@v7
        if: env.EXPO_TOKEN != ''
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: env.EXPO_TOKEN != ''
        run: npm ci

      - uses: expo/expo-github-action@v9
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: ${{ vars.EAS_CLI_VERSION || 'latest' }}
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Delete EAS Update branch
        if: env.EXPO_TOKEN != ''
        env:
          PR: ${{ github.event.pull_request.number }}
        run: eas branch:delete "pr-$PR" --non-interactive || echo "pr-$PR 브랜치가 없습니다(프리뷰를 올리지 않은 PR)."
