# 의존성 업데이트 PR. 일주일에 한 번, 묶어서 올린다(PR 홍수 방지).
# Dependabot PR 도 CI · Risk Score 를 거친다. Dependabot 이 연 PR 의 워크플로에는 시크릿이 없어서
# AI 리뷰와 auto-fix 는 건너뛰고 규칙 기반 점수만 붙는다.
#
# Expo SDK 에 묶인 패키지(expo, expo-*, react-native*, react 등)는 Dependabot 이 올리지 않는다.
# 이들은 SDK 버전과 함께 `npx expo install --fix` 로만 맞춰 올려야 하고, 대부분 네이티브 변경(새 빌드)이다.
# SDK 업그레이드는 세션에서 요청한다("Expo SDK 58 로 올려줘") — 별도 PR, 스토어 출시가 필요하다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@sentry/react-native"
      # jest-expo 가 정한 Jest 메이저를 따른다.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      # eslint-config-expo 가 지원하는 ESLint 메이저를 따른다(ESLint 10 은 eslint-plugin-react 가 깨진다).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # 런타임이 Node 22(.nvmrc)라서 타입도 22 에 맞춘다. 런타임을 올릴 때 같이 올린다.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
